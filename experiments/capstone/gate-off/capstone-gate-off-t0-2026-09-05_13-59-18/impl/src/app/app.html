<div hlmSidebarWrapper>
  <!-- Navigation Rail -->
  <hlm-sidebar>
    <!-- Header/Logo -->
    <div hlmSidebarHeader class="flex items-center justify-between px-4 py-6">
      <span class="text-lg font-bold text-sidebar-foreground">HO</span>
      <button hlmSidebarTrigger class="mobile-only"></button>
    </div>

    <div hlmSidebarSeparator></div>

    <!-- Navigation Menu -->
    <div hlmSidebarContent>
      <nav hlmSidebarMenu>
        <div hlmSidebarMenuItem>
          <button hlmSidebarMenuButton routerLink="/dashboard" routerLinkActive="active">
            <ng-icon name="lucideLayoutDashboard" class="mr-2 size-4" />
            <span>Dashboard</span>
          </button>
        </div>
        <div hlmSidebarMenuItem>
          <button hlmSidebarMenuButton routerLink="/roster" routerLinkActive="active">
            <ng-icon name="lucideUsers" class="mr-2 size-4" />
            <span>Roster</span>
          </button>
        </div>
        <div hlmSidebarMenuItem>
          <button hlmSidebarMenuButton routerLink="/missions" routerLinkActive="active">
            <ng-icon name="lucideTarget" class="mr-2 size-4" />
            <span>Missions</span>
          </button>
        </div>
        <div hlmSidebarMenuItem>
          <button hlmSidebarMenuButton routerLink="/threats" routerLinkActive="active">
            <ng-icon name="lucideShieldAlert" class="mr-2 size-4" />
            <span>Threats</span>
          </button>
        </div>
        <div hlmSidebarMenuItem>
          <button hlmSidebarMenuButton routerLink="/recruit" routerLinkActive="active">
            <ng-icon name="lucideUserPlus" class="mr-2 size-4" />
            <span>Recruit</span>
          </button>
        </div>
        <div hlmSidebarMenuItem>
          <button hlmSidebarMenuButton routerLink="/settings" routerLinkActive="active">
            <ng-icon name="lucideSettings" class="mr-2 size-4" />
            <span>Settings</span>
          </button>
        </div>
      </nav>
    </div>

    <div hlmSidebarSeparator></div>

    <!-- User Footer -->
    <div hlmSidebarFooter class="flex items-center gap-2 px-4 py-4">
      <hlm-avatar class="size-8">
        <img hlmAvatarImage src="https://github.com/shadcn.png" alt="user" />
        <div hlmAvatarFallback>SK</div>
      </hlm-avatar>
      <div class="hidden flex-1">
        <p class="text-sm font-medium text-sidebar-foreground">User</p>
        <p class="text-xs text-sidebar-muted">user@example.com</p>
      </div>
    </div>
  </hlm-sidebar>

  <!-- Main Content -->
  <main hlmSidebarInset>
    <!-- Top Bar -->
    <header class="border-b border-border bg-card px-4 py-4 flex items-center justify-between gap-4">
      <div class="flex flex-1 items-center gap-4">
        <!-- Menu trigger for mobile -->
        <button hlmSidebarTrigger class="mobile-only"></button>
      </div>

      <!-- Right side controls -->
      <div class="flex items-center gap-2">
        <!-- Search -->
        <div class="desktop-only">
          <input
            type="search"
            placeholder="Search..."
            class="hlm-input max-w-xs"
          />
        </div>

        <!-- Notifications -->
        <button hlmBtn size="icon" variant="ghost">
          <ng-icon name="lucideBell" class="size-5" />
          <span class="sr-only">Notifications</span>
        </button>

        <!-- Theme Toggle -->
        <button
          hlmBtn
          size="icon"
          variant="ghost"
          (click)="toggleTheme()"
        >
          @if (isDarkMode()) {
            <ng-icon name="lucideSun" class="size-5" />
            <span class="sr-only">Light mode</span>
          } @else {
            <ng-icon name="lucideMoon" class="size-5" />
            <span class="sr-only">Dark mode</span>
          }
        </button>

        <!-- Account Avatar -->
        <hlm-avatar class="size-8 cursor-pointer">
          <img hlmAvatarImage src="https://github.com/shadcn.png" alt="user" />
          <div hlmAvatarFallback>SK</div>
        </hlm-avatar>
      </div>
    </header>

    <!-- Routed Content -->
    <div class="flex-1 overflow-y-auto">
      <router-outlet />
    </div>
  </main>
</div>
