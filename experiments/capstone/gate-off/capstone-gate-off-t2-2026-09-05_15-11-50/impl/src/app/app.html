<hlm-sidebar>
  <!-- Sidebar Header with Brand -->
  <div class="flex h-16 items-center justify-center px-4 border-b border-sidebar-border">
    <div class="text-xl font-bold text-sidebar-foreground">HO</div>
  </div>

  <!-- Navigation Menu -->
  <ul hlmSidebarMenu class="px-2 flex-1">
    @for (item of navItems; track item.path) {
      <li>
        <a
          [routerLink]="item.path"
          class="flex items-center gap-3 px-3 py-2 rounded-md text-sm font-medium text-sidebar-foreground transition-colors hover:bg-sidebar-accent hover:text-sidebar-accent-foreground"
          [class.bg-sidebar-primary]="router.url.startsWith(item.path.split('/')[1] ? '/' + item.path.split('/')[1] : '')"
        >
          <ng-icon class="w-5 h-5 shrink-0" [name]="item.icon"></ng-icon>
          <span>{{ item.label }}</span>
        </a>
      </li>
    }
  </ul>

  <!-- Sidebar Footer -->
  <div class="border-t border-sidebar-border p-3">
    <button hlmBtn variant="ghost" size="icon-sm" class="w-full text-sidebar-foreground hover:bg-sidebar-accent">
      <ng-icon name="lucideSettings" class="w-5 h-5"></ng-icon>
    </button>
  </div>
</hlm-sidebar>

<!-- Main Content Area -->
<main hlmSidebarInset>
  <!-- Top Bar -->
  <header class="sticky top-0 z-40 flex h-16 items-center justify-between gap-4 border-b border-border bg-card px-4 shadow-sm">
    <!-- Left: Menu trigger and title -->
    <div class="flex items-center gap-3 min-w-0">
      <button hlmSidebarTrigger></button>
      <div class="text-sm font-medium text-muted-foreground">Hero Ops Console</div>
    </div>

    <!-- Right: Search, notifications, theme toggle, avatar -->
    <div class="flex items-center gap-2">
      <!-- Search -->
      <div class="hidden sm:flex items-center gap-2 rounded-md bg-muted px-3 py-1">
        <ng-icon name="lucideSearch" class="h-4 w-4 text-muted-foreground"></ng-icon>
        <input
          hlmInput
          type="text"
          placeholder="Search..."
          class="h-8 w-32 bg-transparent text-sm focus-visible:outline-none border-0"
        />
      </div>

      <!-- Notifications -->
      <button hlmBtn variant="ghost" size="icon-sm" class="relative">
        <ng-icon name="lucideBell" class="h-5 w-5"></ng-icon>
      </button>

      <!-- Theme Toggle -->
      <button hlmBtn variant="ghost" size="icon-sm" (click)="toggleTheme()">
        @if (theme() === 'light') {
          <ng-icon name="lucideMoon" class="h-5 w-5"></ng-icon>
        } @else {
          <ng-icon name="lucideSun" class="h-5 w-5"></ng-icon>
        }
      </button>

      <!-- Avatar -->
      <div class="flex items-center gap-2 pl-2 border-l border-border">
        <img
          src="https://api.dicebear.com/7.x/avataaars/svg?seed=Hero"
          alt="User"
          class="h-8 w-8 rounded-full"
        />
      </div>
    </div>
  </header>

  <!-- Content Region -->
  <div class="flex-1 overflow-y-auto">
    <router-outlet></router-outlet>
  </div>
</main>
