<div class="flex h-screen bg-background text-foreground">
  <!-- Navigation Rail -->
  <hlm-sidebar collapsible="offcanvas" class="flex-shrink-0">
    <hlm-sidebar-header class="flex items-center justify-between p-4">
      <div class="flex items-center gap-2">
        <div class="flex size-8 items-center justify-center rounded-md bg-primary text-primary-foreground font-bold">H</div>
        <span class="hidden sm:inline font-semibold">Hero Ops</span>
      </div>
    </hlm-sidebar-header>

    <hlm-sidebar-content class="flex-1">
      <hlm-sidebar-group>
        <div hlmSidebarGroupLabel>Navigation</div>
        <ul hlmSidebarMenu>
          <li hlmSidebarMenuItem>
            <a
              hlmSidebarMenuButton
              [routerLink]="'/dashboard'"
              routerLinkActive="bg-sidebar-primary text-sidebar-foreground"
              [routerLinkActiveOptions]="{ exact: true }"
            >
              <ng-icon name="lucideLayoutDashboard" class="size-4"></ng-icon>
              <span class="hidden sm:inline">Dashboard</span>
            </a>
          </li>

          <li hlmSidebarMenuItem>
            <a
              hlmSidebarMenuButton
              [routerLink]="'/roster'"
              routerLinkActive="bg-sidebar-primary text-sidebar-foreground"
            >
              <ng-icon name="lucideUsers" class="size-4"></ng-icon>
              <span class="hidden sm:inline">Roster</span>
            </a>
          </li>

          <li hlmSidebarMenuItem>
            <a
              hlmSidebarMenuButton
              [routerLink]="'/threats'"
              routerLinkActive="bg-sidebar-primary text-sidebar-foreground"
            >
              <ng-icon name="lucideShieldAlert" class="size-4"></ng-icon>
              <span class="hidden sm:inline">Threats</span>
            </a>
          </li>

          <li hlmSidebarMenuItem>
            <a
              hlmSidebarMenuButton
              [routerLink]="'/recruit'"
              routerLinkActive="bg-sidebar-primary text-sidebar-foreground"
            >
              <ng-icon name="lucideUserPlus" class="size-4"></ng-icon>
              <span class="hidden sm:inline">Recruit</span>
            </a>
          </li>

          <li hlmSidebarMenuItem>
            <a
              hlmSidebarMenuButton
              [routerLink]="'/settings'"
              routerLinkActive="bg-sidebar-primary text-sidebar-foreground"
            >
              <ng-icon name="lucideSettings" class="size-4"></ng-icon>
              <span class="hidden sm:inline">Settings</span>
            </a>
          </li>
        </ul>
      </hlm-sidebar-group>
    </hlm-sidebar-content>

    <hlm-sidebar-footer class="border-t border-sidebar-border p-4">
      <ul hlmSidebarMenu>
        <li hlmSidebarMenuItem>
          <hlm-avatar class="size-8">
            <img hlmAvatarImage src="https://api.dicebear.com/7.x/avataaars/svg?seed=user" alt="User" />
            <div hlmAvatarFallback>US</div>
          </hlm-avatar>
          <div class="hidden sm:block text-sm font-medium leading-tight">
            <div>User Name</div>
            <div class="text-sidebar-muted text-xs">admin@example.com</div>
          </div>
        </li>
      </ul>
    </hlm-sidebar-footer>
  </hlm-sidebar>

  <!-- Main Content Area -->
  <div class="flex flex-1 flex-col overflow-hidden">
    <!-- Top Bar -->
    <header class="flex h-16 items-center gap-4 border-b border-border bg-card px-4 sm:px-6">
      <!-- Sidebar Trigger for Mobile -->
      <button hlmSidebarTrigger class="md:hidden">
        <ng-icon name="lucideMenu" class="size-5"></ng-icon>
      </button>

      <!-- Breadcrumb / Title (placeholder) -->
      <div class="flex-1 min-w-0">
        <h1 class="truncate text-sm font-medium text-foreground">Operations Dashboard</h1>
      </div>

      <!-- Search (icon only on mobile, full on desktop) -->
      <div class="hidden sm:flex items-center bg-muted rounded-md px-3 py-2 text-sm focus-within:ring-2 focus-within:ring-ring w-64">
        <ng-icon name="lucideSearch" class="size-4 text-muted-foreground flex-shrink-0"></ng-icon>
        <input
          type="text"
          placeholder="Search heroes..."
          class="ml-2 flex-1 bg-transparent outline-none placeholder:text-muted-foreground"
        />
      </div>

      <!-- Mobile Search Icon -->
      <button class="sm:hidden p-2 hover:bg-muted rounded-md transition-colors">
        <ng-icon name="lucideSearch" class="size-5 text-foreground"></ng-icon>
      </button>

      <!-- Notifications -->
      <button
        hlmBtn
        variant="ghost"
        size="sm"
        class="relative p-2"
        hlmTooltip="Notifications"
      >
        <ng-icon name="lucideBell" class="size-5"></ng-icon>
      </button>

      <!-- Theme Toggle -->
      <button
        hlmBtn
        variant="ghost"
        size="sm"
        class="p-2"
        (click)="toggleTheme()"
        [hlmTooltip]="isDark() ? 'Light mode' : 'Dark mode'"
      >
        <ng-icon [name]="isDark() ? 'lucideSun' : 'lucideMoon'" class="size-5"></ng-icon>
      </button>

      <!-- Account Avatar -->
      <hlm-avatar class="size-8 cursor-pointer hover:ring-2 hover:ring-primary">
        <img hlmAvatarImage src="https://api.dicebear.com/7.x/avataaars/svg?seed=user" alt="User" />
        <div hlmAvatarFallback>US</div>
      </hlm-avatar>
    </header>

    <!-- Routed Content -->
    <main class="flex-1 overflow-auto bg-background">
      <div class="p-4 sm:p-6">
        <router-outlet />
      </div>
    </main>
  </div>
</div>
