<div class="flex h-screen bg-background">
  <!-- Sidebar -->
  <hlm-sidebar>
    <div hlmSidebarHeader>
      <div class="font-bold">Hero Ops</div>
    </div>

    <div hlmSidebarContent>
      <ul hlmSidebarMenu>
        <div hlmSidebarGroup>
          <li hlmSidebarMenuItem>
            <button hlmSidebarMenuButton [routerLink]="'/dashboard'">
              <ng-icon name="lucideLayoutDashboard"></ng-icon>
              <span>Dashboard</span>
            </button>
          </li>

          <li hlmSidebarMenuItem>
            <button hlmSidebarMenuButton [routerLink]="'/roster'">
              <ng-icon name="lucideUsers"></ng-icon>
              <span>Roster</span>
            </button>
          </li>

          <li hlmSidebarMenuItem>
            <button hlmSidebarMenuButton [routerLink]="'/missions'">
              <ng-icon name="lucideTarget"></ng-icon>
              <span>Missions</span>
            </button>
          </li>

          <li hlmSidebarMenuItem>
            <button hlmSidebarMenuButton [routerLink]="'/threats'">
              <ng-icon name="lucideShieldAlert"></ng-icon>
              <span>Threats</span>
            </button>
          </li>

          <li hlmSidebarMenuItem>
            <button hlmSidebarMenuButton [routerLink]="'/recruit'">
              <ng-icon name="lucideUserPlus"></ng-icon>
              <span>Recruit</span>
            </button>
          </li>

          <li hlmSidebarMenuItem>
            <button hlmSidebarMenuButton [routerLink]="'/settings'">
              <ng-icon name="lucideSettings"></ng-icon>
              <span>Settings</span>
            </button>
          </li>
        </div>
      </ul>
    </div>

    <div hlmSidebarFooter>
      <button hlmBtn variant="ghost" size="sm" class="w-full justify-start" (click)="vm.toggleTheme()">
        <ng-icon [name]="vm.theme.isDark() ? 'lucideSun' : 'lucideMoon'"></ng-icon>
        <span class="hidden sm:inline">{{ vm.theme.isDark() ? 'Light' : 'Dark' }}</span>
      </button>
    </div>
  </hlm-sidebar>

  <!-- Main content area -->
  <main hlmSidebarInset class="flex flex-col flex-1">
    <!-- Top bar -->
    <header class="flex items-center justify-between gap-4 bg-background border-b border-border">
      <button hlmSidebarTrigger class="lg:hidden"></button>
      <div class="flex-1">
        <h1 class="font-semibold text-foreground">Hero Ops Console</h1>
      </div>
      <div class="flex items-center gap-4">
        <button hlmBtn variant="ghost" size="icon" class="hidden sm:inline-flex">
          <ng-icon name="lucideSearch"></ng-icon>
        </button>
        <button hlmBtn variant="ghost" size="icon">
          <ng-icon name="lucideBell"></ng-icon>
        </button>
        <hlm-avatar>
          <div hlmAvatarFallback>OP</div>
        </hlm-avatar>
      </div>
    </header>

    <!-- Routed content -->
    <div class="flex-1 overflow-auto bg-background">
      <router-outlet />
    </div>
  </main>
</div>
