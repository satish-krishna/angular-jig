<div hlm-sidebar-wrapper class="grid min-h-screen">
  <aside hlm-sidebar>
    <div hlmSidebarHeader>
      <span>Hero Ops</span>
    </div>

    <nav hlmSidebarContent>
      <ul hlmSidebarMenu>
        <li>
          <a hlmSidebarMenuButton routerLink="/dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
            <ng-icon name="lucideLayoutDashboard" />
            <span>Dashboard</span>
          </a>
        </li>
        <li>
          <a hlmSidebarMenuButton routerLink="/roster" routerLinkActive="active">
            <ng-icon name="lucideUsers" />
            <span>Roster</span>
          </a>
        </li>
        <li>
          <a hlmSidebarMenuButton routerLink="/threats" routerLinkActive="active">
            <ng-icon name="lucideShieldAlert" />
            <span>Threats</span>
          </a>
        </li>
        <li>
          <a hlmSidebarMenuButton routerLink="/recruit" routerLinkActive="active">
            <ng-icon name="lucideUserPlus" />
            <span>Recruit</span>
          </a>
        </li>
        <li>
          <a hlmSidebarMenuButton routerLink="/settings" routerLinkActive="active">
            <ng-icon name="lucideSettings" />
            <span>Settings</span>
          </a>
        </li>
      </ul>
    </nav>

    <div hlmSidebarFooter>
      <button hlmBtn variant="ghost" size="sm" (click)="vm.toggleTheme()">
        <ng-icon [name]="vm.isDark() ? 'lucideMoon' : 'lucideSun'" />
        <span>{{ vm.isDark() ? 'Dark' : 'Light' }}</span>
      </button>
    </div>
  </aside>

  <div hlm-sidebar-inset class="flex flex-col">
    <header class="flex items-center justify-between gap-4">
      <div class="flex items-center gap-2">
        <button hlmSidebarTrigger hlmBtn variant="ghost" size="sm" [attr.aria-label]="'Toggle sidebar'">
          <ng-icon name="lucideSearch" />
        </button>
      </div>

      <div class="flex-1"></div>

      <div class="flex items-center gap-2">
        <button hlmBtn variant="ghost" size="sm" [attr.aria-label]="'Notifications'">
          <ng-icon name="lucideBell" />
        </button>
      </div>
    </header>

    <main class="flex-1 overflow-auto">
      <router-outlet />
    </main>
  </div>
</div>
