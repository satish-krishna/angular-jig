<div class="flex h-screen overflow-hidden">
  <!-- Navigation Rail -->
  <hlm-sidebar>
    <hlm-sidebar-content class="flex flex-col h-full">
      <!-- Header / Brand -->
      <hlm-sidebar-header>
        <div class="flex items-center gap-2">
          <div class="w-8 h-8 rounded bg-sidebar-primary flex items-center justify-center text-sidebar-primary-foreground font-bold text-sm">
            HO
          </div>
          <span class="hidden sm:inline text-sm font-semibold text-sidebar-foreground">Hero Ops</span>
        </div>
      </hlm-sidebar-header>

      <!-- Main Navigation Menu -->
      <div hlmSidebarGroup class="flex-1">
        <div hlmSidebarGroupContent>
          <ul hlmSidebarMenu>
            <li hlmSidebarMenuItem>
              <a
                hlmSidebarMenuButton
                routerLink="/dashboard"
                routerLinkActive="[hlm-sidebar-menu-button-active]"
                [routerLinkActiveOptions]="{ exact: true }"
              >
                <ng-icon name="lucideLayoutDashboard" />
                <span class="hidden sm:inline">Dashboard</span>
              </a>
            </li>
            <li hlmSidebarMenuItem>
              <a
                hlmSidebarMenuButton
                routerLink="/roster"
                routerLinkActive="[hlm-sidebar-menu-button-active]"
              >
                <ng-icon name="lucideUsers" />
                <span class="hidden sm:inline">Roster</span>
              </a>
            </li>
            <li hlmSidebarMenuItem>
              <a
                hlmSidebarMenuButton
                routerLink="/missions"
                routerLinkActive="[hlm-sidebar-menu-button-active]"
              >
                <ng-icon name="lucideTarget" />
                <span class="hidden sm:inline">Missions</span>
              </a>
            </li>
            <li hlmSidebarMenuItem>
              <a
                hlmSidebarMenuButton
                routerLink="/threats"
                routerLinkActive="[hlm-sidebar-menu-button-active]"
              >
                <ng-icon name="lucideShieldAlert" />
                <span class="hidden sm:inline">Threats</span>
              </a>
            </li>
            <li hlmSidebarMenuItem>
              <a
                hlmSidebarMenuButton
                routerLink="/recruit"
                routerLinkActive="[hlm-sidebar-menu-button-active]"
              >
                <ng-icon name="lucideUserPlus" />
                <span class="hidden sm:inline">Recruit</span>
              </a>
            </li>
            <li hlmSidebarMenuItem>
              <a
                hlmSidebarMenuButton
                routerLink="/settings"
                routerLinkActive="[hlm-sidebar-menu-button-active]"
              >
                <ng-icon name="lucideSettings" />
                <span class="hidden sm:inline">Settings</span>
              </a>
            </li>
          </ul>
        </div>
      </div>

      <!-- Footer / User Section -->
      <hlm-sidebar-footer>
        <ul hlmSidebarMenu>
          <li hlmSidebarMenuItem>
            <a hlmSidebarMenuButton (click)="vm.toggleTheme()" class="cursor-pointer">
              @if (vm.isDark()) {
                <ng-icon name="lucideMoon" />
              } @else {
                <ng-icon name="lucideSun" />
              }
              <span class="hidden sm:inline">{{ vm.isDark() ? 'Dark' : 'Light' }}</span>
            </a>
          </li>
        </ul>
      </hlm-sidebar-footer>
    </hlm-sidebar-content>
  </hlm-sidebar>

  <!-- Main Content Area -->
  <div class="flex flex-col flex-1 overflow-hidden">
    <!-- Top Bar -->
    <header class="bg-card px-4 py-3 flex items-center gap-4">
      <!-- Mobile Menu Trigger -->
      <button hlmSidebarTrigger class="sm:hidden">
        <ng-icon name="lucideMenu" />
      </button>

      <!-- Breadcrumb / Title -->
      <div class="flex-1 text-sm font-medium">
        <span>Hero Ops Console</span>
      </div>

      <!-- Search -->
      <div class="hidden md:flex items-center gap-2">
        <input
          hlmInput
          type="text"
          placeholder="Search..."
        />
      </div>

      <!-- Right Controls -->
      <div class="flex items-center gap-2">
        <!-- Notifications -->
        <button hlmBtn variant="ghost" size="sm">
          <ng-icon name="lucideBell" />
        </button>

        <!-- Avatar -->
        <hlm-avatar>
          <img hlmAvatarImage src="https://github.com/shadcn.png" alt="@shadcn" />
          <div hlmAvatarFallback>SH</div>
        </hlm-avatar>
      </div>
    </header>

    <!-- Routed Content -->
    <main class="flex-1 overflow-auto bg-background">
      <router-outlet />
    </main>
  </div>
</div>
