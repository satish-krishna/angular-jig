<article hlmCard class="stat-tile">
  <div hlmCardHeader class="stat-tile__header">
    <p hlmCardDescription>{{ label() }}</p>
    <ng-icon hlmIcon [name]="icon()" tone="muted" />
  </div>
  <div hlmCardContent>
    <p hlmCardTitle emphasis="stat">{{ value() }}</p>
    <p hlmMuted>{{ hint() }}</p>
  </div>
</article>
