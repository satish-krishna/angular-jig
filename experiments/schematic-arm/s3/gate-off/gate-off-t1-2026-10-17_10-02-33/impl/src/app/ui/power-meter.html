<div class="power-meter">
  <div class="power-meter__header">
    <span hlmMuted>Power</span>
    <span hlmSmall>{{ value() }}</span>
  </div>
  <meter
    class="power-meter__bar"
    min="0"
    max="100"
    low="40"
    high="75"
    optimum="100"
    [value]="value()"
    [attr.aria-label]="label()"
  ></meter>
</div>
