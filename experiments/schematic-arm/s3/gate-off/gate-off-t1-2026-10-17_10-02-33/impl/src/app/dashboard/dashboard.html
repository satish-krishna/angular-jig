<div class="dashboard">
  <header class="dashboard__header">
    <div class="dashboard__intro">
      <h1 hlmH1>Operations Dashboard</h1>
      <p hlmMuted>Example data. The roster and every figure on this page are invented for the demo.</p>
    </div>
    <a hlmBtn routerLink="/recruit">
      <ng-icon hlmIcon name="lucideUserPlus" />
      Recruit
    </a>
  </header>

  <div class="dashboard__stats">
    @for (stat of vm.stats(); track stat.id) {
      <app-stat-tile
        [label]="stat.label"
        [value]="stat.value"
        [hint]="stat.hint"
        [icon]="stat.icon"
      />
    }
  </div>

  <section class="dashboard__section">
    <header class="dashboard__section-header">
      <h2 hlmH2>Top heroes this cycle</h2>
      <a hlmBtn variant="ghost" routerLink="/roster">
        <ng-icon hlmIcon name="lucideUsers" />
        View all roster
      </a>
    </header>
    <div class="dashboard__heroes">
      @for (hero of vm.topHeroes(); track hero.id) {
        <app-hero-card [hero]="hero" />
      }
    </div>
  </section>

  <section class="dashboard__section">
    <header class="dashboard__section-header">
      <h2 hlmH2>Roster</h2>
      <span hlmBadge variant="secondary">{{ vm.rosterCount() }} heroes</span>
    </header>
    <app-roster-table [rows]="vm.rosterRows()" />
  </section>
</div>
