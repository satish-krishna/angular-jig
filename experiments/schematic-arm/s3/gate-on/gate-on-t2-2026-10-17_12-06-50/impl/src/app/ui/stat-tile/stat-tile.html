<section hlmCard class="stat-tile">
  <div hlmCardHeader class="stat-tile__header">
    <p hlmCardDescription class="stat-tile__label">{{ label() }}</p>
    <ng-icon hlmIcon [name]="icon()" [tone]="tone()" />
  </div>
  <div hlmCardContent class="stat-tile__body">
    <p hlmLarge class="stat-tile__value">{{ value() }}</p>
    <p hlmMuted>{{ hint() }}</p>
  </div>
</section>
