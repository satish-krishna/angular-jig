<div class="power-meter">
  <div class="power-meter__head">
    <span>Power</span>
    <span class="power-meter__value">{{ value() }}</span>
  </div>
  <div
    class="power-meter__track"
    role="meter"
    aria-valuemin="0"
    aria-valuemax="100"
    [attr.aria-valuenow]="value()"
    [attr.aria-label]="label()"
  >
    <div class="power-meter__fill" [style.width.%]="value()"></div>
  </div>
</div>
