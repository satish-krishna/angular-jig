<hlm-card class="hero-card">
  <hlm-card-header>
    <div class="hero-card__identity">
      <hlm-avatar size="lg" class="hero-card__avatar">
        <span hlmAvatarFallback>{{ initials() }}</span>
      </hlm-avatar>
      <div class="hero-card__names">
        <h3 hlmCardTitle class="hero-card__name">{{ hero().name }}</h3>
        <p hlmCardDescription class="hero-card__alias">{{ hero().id }} · {{ hero().alias }}</p>
      </div>
    </div>
  </hlm-card-header>

  <div hlmCardContent class="hero-card__body">
    <div class="hero-card__badges">
      <span hlmBadge variant="secondary">{{ hero().powerClass }}</span>
      <span hlmBadge variant="outline">
        <span
          class="hero-card__dot"
          [class.hero-card__dot--active]="hero().status === 'Active'"
          [class.hero-card__dot--injured]="hero().status === 'Injured'"
          [class.hero-card__dot--reserve]="hero().status === 'Reserve'"
          [class.hero-card__dot--mia]="hero().status === 'MIA'"
        ></span>
        {{ hero().status }}
      </span>
    </div>

    <app-power-meter [value]="hero().powerIndex" [label]="'Power index for ' + hero().name" />

    <dl class="hero-card__stats">
      <div class="hero-card__stat">
        <dt class="hero-card__stat-label">Missions</dt>
        <dd class="hero-card__stat-value">{{ hero().missionCount }}</dd>
      </div>
      <div class="hero-card__stat">
        <dt class="hero-card__stat-label">Success</dt>
        <dd class="hero-card__stat-value">{{ hero().successRate }}%</dd>
      </div>
      <div class="hero-card__stat">
        <dt class="hero-card__stat-label">Clearance</dt>
        <dd class="hero-card__stat-value">T{{ hero().clearanceTier }}</dd>
      </div>
    </dl>
  </div>

  <hlm-card-footer>
    <button hlmBtn variant="outline" type="button" class="hero-card__open" (click)="open.emit(hero())">
      Open dossier
    </button>
  </hlm-card-footer>
</hlm-card>
