<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>AngularJig</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>
<body>
  <script>
    // Apply the saved or system theme before first paint, so a dark user never sees a flash.
    (function () {
      try {
        var stored = localStorage.getItem('hero-ops-theme');
        var dark = stored ? stored === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
        if (dark) document.documentElement.classList.add('dark');
      } catch (e) {}
    })();
  </script>
  <app-root></app-root>
</body>
</html>
