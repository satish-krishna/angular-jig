<div class="power-meter">
  <div class="power-meter__head">
    <span class="power-meter__label">{{ label() }}</span>
    <span class="power-meter__value">{{ value() }}</span>
  </div>
  <div
    class="power-meter__track"
    role="meter"
    [attr.aria-label]="label()"
    aria-valuemin="0"
    aria-valuemax="100"
    [attr.aria-valuenow]="value()"
    [attr.aria-valuetext]="value() + ' of 100'"
  >
    <div class="power-meter__fill" [style.width.%]="fill()"></div>
  </div>
</div>
