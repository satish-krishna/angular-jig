<div class="power-meter">
  <div class="power-meter__head">
    <span hlmSmall>Power index</span>
    <span hlmSmall>{{ value() }} / 100</span>
  </div>
  <meter
    class="power-meter__bar"
    min="0"
    max="100"
    [value]="value()"
    [attr.aria-label]="'Power index ' + value() + ' of 100'"
  ></meter>
</div>
