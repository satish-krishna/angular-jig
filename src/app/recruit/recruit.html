<div class="recruit">

      <div hlmCardContent>
        <app-hero-form [initialValue]="vm.newHeroTemplate" submitLabel="Recruit" (saveHero)="vm.createHero($event)" (cancel)="vm.cancel()" />
      </div>
    </hlm-card>
  </div>
</div>
