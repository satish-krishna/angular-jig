<div class="power-meter">
  <div class="power-meter__header">
    <span hlmMuted>{{ label() }}</span>
    <span hlmSmall>{{ value() }} / {{ max() }}</span>
  </div>
  <hlm-progress variant="muted" [attr.aria-label]="label()" [value]="clamped()" [max]="max()">
    <hlm-progress-indicator />
  </hlm-progress>
</div>
