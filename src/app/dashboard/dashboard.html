<div class="dashboard">
  <!-- Header -->
  <div class="dashboard__header">
    <h1 hlmH1 variant="page">Operations Dashboard</h1>
    <a routerLink="/recruit" hlmBtn variant="default">
      <ng-icon hlmIcon name="lucideUserPlus" />
      <span>Recruit</span>
    </a>
  </div>

  <!-- Stats grid -->
  <div class="dashboard__tiles">
    <app-stat-tile
      label="Total Heroes"
      [value]="vm.totalHeroes()"
      icon="lucideUserCheck"
    />
    <app-stat-tile
      label="Active Missions"
      [value]="vm.activeMissions()"
      icon="lucideActivity"
    />
    <app-stat-tile
      label="Avg Power"
      [value]="vm.averagePower()"
      icon="lucideZap"
    />
    <app-stat-tile
      label="Threats"
      [value]="vm.threats()"
      icon="lucideShieldAlert"
    />
  </div>

  <!-- Top heroes section -->
  <div class="dashboard__section">
    <div class="dashboard__section-header">
      <h2 hlmH3 variant="section">Top Heroes This Cycle</h2>
      <a routerLink="/roster" hlmSmall variant="link">View all roster</a>
    </div>
    <div class="dashboard__tiles">
      @for (hero of vm.topHeroes(); track hero.id) {
        <app-hero-card [hero]="hero" (select)="goToHero($event.id)" />
      }
    </div>
  </div>

  <!-- Roster preview section -->
  <div class="dashboard__section">
    <h2 hlmH3 variant="section">Roster</h2>
    <hlm-card>
      <hlm-card-header>
        <p hlmCardDescription>{{ vm.totalHeroes() }} heroes on file</p>
      </hlm-card-header>
      <hlm-card-footer>
        <a routerLink="/roster" hlmBtn variant="outline" size="sm">
          <span>View full roster</span>
        </a>
      </hlm-card-footer>
    </hlm-card>
  </div>
</div>
