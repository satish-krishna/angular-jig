<div hlmSidebarWrapper>
  <!-- Sidebar navigation rail (dark in both themes) -->
  <nav>
    <hlm-sidebar side="left">
      <!-- Brand -->
      <div hlmSidebarHeader>
        <div class="flex items-center gap-2">
          <div class="size-8 rounded-lg bg-primary"></div>
          <span class="font-bold text-lg text-sidebar-foreground">Hero Ops</span>
        </div>
      </div>

      <!-- Navigation menu -->
      <div hlmSidebarContent>
        <div hlmSidebarGroup>
          <ul hlmSidebarMenu>
            <li hlmSidebarMenuItem>
              <a
                hlmSidebarMenuButton
                routerLink="/dashboard"
                routerLinkActive #rlaDashboard="routerLinkActive"
                [isActive]="rlaDashboard.isActive"
                [attr.aria-current]="rlaDashboard.isActive ? 'page' : null"
                [routerLinkActiveOptions]="{ exact: true }"
              >
                <ng-icon name="lucideLayoutDashboard" />
                <span>Dashboard</span>
              </a>
            </li>

            <li hlmSidebarMenuItem>
              <a hlmSidebarMenuButton routerLink="/roster" routerLinkActive #rlaRoster="routerLinkActive" [isActive]="rlaRoster.isActive" [attr.aria-current]="rlaRoster.isActive ? 'page' : null" [routerLinkActiveOptions]="{ exact: true }">
                <ng-icon name="lucideUsers" />
                <span>Roster</span>
              </a>
            </li>

            <li hlmSidebarMenuItem>
              <a hlmSidebarMenuButton routerLink="/missions" routerLinkActive #rlaMissions="routerLinkActive" [isActive]="rlaMissions.isActive" [attr.aria-current]="rlaMissions.isActive ? 'page' : null">
                <ng-icon name="lucideTarget" />
                <span>Missions</span>
              </a>
            </li>

            <li hlmSidebarMenuItem>
              <a hlmSidebarMenuButton routerLink="/threats" routerLinkActive #rlaThreats="routerLinkActive" [isActive]="rlaThreats.isActive" [attr.aria-current]="rlaThreats.isActive ? 'page' : null">
                <ng-icon name="lucideShieldAlert" />
                <span>Threats</span>
              </a>
            </li>

            <li hlmSidebarMenuItem>
              <a hlmSidebarMenuButton routerLink="/recruit" routerLinkActive #rlaRecruit="routerLinkActive" [isActive]="rlaRecruit.isActive" [attr.aria-current]="rlaRecruit.isActive ? 'page' : null">
                <ng-icon name="lucideUserPlus" />
                <span>Recruit</span>
              </a>
            </li>

            <li hlmSidebarMenuItem>
              <a hlmSidebarMenuButton routerLink="/settings" routerLinkActive #rlaSettings="routerLinkActive" [isActive]="rlaSettings.isActive" [attr.aria-current]="rlaSettings.isActive ? 'page' : null">
                <ng-icon name="lucideSettings" />
                <span>Settings</span>
              </a>
            </li>
          </ul>
        </div>
      </div>

      <!-- Footer user section -->
      <div hlmSidebarFooter>
        <div class="flex items-center gap-2">
          <hlm-avatar>
            <span hlmAvatarFallback>HC</span>
          </hlm-avatar>
          <div class="min-w-0 flex-1">
            <p class="text-sm font-medium text-sidebar-foreground">Hero Command</p>
            <p class="text-xs text-sidebar-muted truncate">admin@heroops.local</p>
          </div>
        </div>
      </div>
    </hlm-sidebar>
  </nav>

  <!-- Main content area -->
  <main hlmSidebarInset>
    <!-- Topbar -->
    <header class="flex h-16 items-center justify-between border-b border-border bg-background px-6 gap-4">
      <!-- Left: Mobile menu trigger + breadcrumb -->
      <div class="flex items-center gap-4">
        <button hlmSidebarTrigger aria-label="Toggle sidebar"></button>
        <span class="text-sm text-muted-foreground">Hero Ops Console</span>
      </div>

      <!-- Right: Search, notifications, theme, avatar -->
      <div class="flex items-center gap-2">
        <!-- Search icon -->
        <button hlmBtn size="icon" variant="ghost" [title]="'Search heroes'" hlmTooltip side="bottom" aria-label="Search heroes">
          <ng-icon name="lucideSearch" />
        </button>

        <!-- Notifications -->
        <button hlmBtn size="icon" variant="ghost" [title]="'Notifications'" hlmTooltip side="bottom" aria-label="Notifications">
          <ng-icon name="lucideBell" />
        </button>

        <!-- Theme toggle -->
        <button
          hlmBtn
          size="icon"
          variant="ghost"
          (click)="vm.toggleTheme()"
          [title]="vm.isDark() ? 'Light mode' : 'Dark mode'"
          hlmTooltip
          side="bottom"
          [attr.aria-label]="vm.isDark() ? 'Light mode' : 'Dark mode'"
        >
          @if (vm.isDark()) {
            <ng-icon name="lucideSun" />
          } @else {
            <ng-icon name="lucideMoon" />
          }
        </button>

        <!-- Account avatar -->
        <hlm-avatar>
          <span hlmAvatarFallback>HC</span>
        </hlm-avatar>
      </div>
    </header>

    <!-- Routed screen content (scrollable) -->
    <div class="flex-1 overflow-y-auto">
      <router-outlet />
    </div>
  </main>
</div>
